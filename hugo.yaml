  about:
    enable: true
    title: "About Me"
    content: |-
      I'm an AI Application Engineer based in Seoul, focused on Information
      Retrieval and scalable backend systems. My day-to-day is building
      **Agentic RAG** systems, tuning **hybrid vector search**, squeezing
      latency out of retrieval pipelines, and automating ML workflows with
      **Prefect, Kubernetes, and GitOps**.

      Currently a Machine Learning Engineer at **Boeing**, where I work on
      FAA-compliance RAG and predictive maintenance pipelines. Before that,
      at **Lomin**, I optimized Transformer inference serving with NVIDIA
      Triton and built document-understanding systems for financial clients.

      I graduated from Konkuk University in 2022 with a B.S. in Electrical
      and Electronics Engineering, and spent a semester on exchange at the
      University of Agder in Norway.
    skills:
      enable: true
      title: "Technologies I work with:"
      items:
        - "Python"
        - "C++"
        - "PyTorch"
        - "LangChain"
        - "Qdrant"
        - "FastAPI"
        - "Redis"
        - "PostgreSQL"
        - "Kubernetes (OpenShift)"
        - "ArgoCD"
        - "Prefect"
        - "MLflow"
        - "NVIDIA Triton"
        - "ONNX Runtime"
        - "OpenVINO"
        - "Grafana"
        - "Prometheus"

  experience:
    enable: true
    items:
      - company: "Boeing"
        companyUrl: "https://www.boeing.com/"
        jobs:
          - name: "Machine Learning Engineer"
            date: "Jan 2024 – present"
            info:
              content: Information Retrieval & MLOps
            content: |-
              **Information Retrieval**
              - Architected an Agentic RAG system for FAA compliance workflows,
                improving MRR by **7%** on domain-specific technical terminology.
              - Implemented hybrid search on Qdrant while keeping **p95
                retrieval latency under 500 ms**.
              - Deployed embedding models via BentoML with ONNX Runtime and
                quantization for efficient inference.
              - Established Prometheus & Grafana monitoring with custom KPI
                tracking for retrieval quality and system health.

              **MLOps & Backend Automation**
              - Reduced deployment cycles from **1 hour to 10 minutes** via
                ArgoCD and OpenShift GitOps.
              - Built Prefect orchestration for data ingestion and predictive
                maintenance pipelines.
              - Automated PDF report generation with a FastAPI backend,
                eliminating **~8 hours of manual work per week**.

      - company: "Lomin"
        companyUrl: "https://lomin.ai/"
        jobs:
          - name: "Machine Learning Engineer"
            date: "May 2022 – Aug 2023"
            info:
              content: Inference optimization & document understanding at a document-AI startup.
            content: |-
              **Inference & Serving Optimization**
              - Architected a high-throughput NVIDIA Triton serving layer
                with KV-caching and quantization, accelerating Transformer
                inference by **20%**.
              - Engineered multi-modal table-extraction systems, improving F1
                by **15%** for financial-services clients.

              **Retrieval & Fine-tuning**
              - Developed a Document Understanding framework with
                graph-based augmentation and dataset curation pipelines.

