    content: |-
      I'm an AI Application Engineer based in Seoul, focused on Information
      Retrieval and scalable backend systems. My day-to-day is building
      **Agentic RAG** systems, tuning **hybrid vector search**, squeezing
      latency out of retrieval pipelines, and automating ML workflows with
      **Prefect, Kubernetes, and GitOps**.

      Currently a Machine Learning Engineer at **Boeing**, where I work on
      FAA-compliance RAG and predictive maintenance pipelines. Before that,
      at **Lomin**, I optimized Transformer inference serving with NVIDIA
      Triton and built document-understanding systems for financial clients.

      I graduated from Konkuk University in 2022 with a B.S. in Electrical
      and Electronics Engineering, and spent a semester on exchange at the
      University of Agder in Norway.
