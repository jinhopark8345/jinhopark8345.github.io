  customScripts: |-
    <style>
      section#about,
      section#experience,
      section#open-source,
      section#education,
      section#competitions,
      section#certifications {
        padding-top: 1rem !important;
        padding-bottom: 1rem !important;
      }
      section#experience .py-5,
      section#experience .py-4,
      section#open-source .py-4,
      section#education .py-4,
      section#competitions .py-4,
      section#certifications .py-4,
      section#about .py-5 {
        padding-top: 0.5rem !important;
        padding-bottom: 0.5rem !important;
      }
    </style>
    <button id="toggle-all-btn" type="button" class="btn btn-primary shadow"
      style="position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 1030; border-radius: 999px; padding: 0.6rem 1.1rem;"
      aria-label="Expand all sections">
      <i class="fas fa-expand-arrows-alt me-2"></i><span id="toggle-all-label">Expand all</span>
    </button>
    <script>
    (function () {
      document.addEventListener('DOMContentLoaded', function () {
        var btn = document.getElementById('toggle-all-btn');
        var label = document.getElementById('toggle-all-label');
        if (!btn || typeof bootstrap === 'undefined') return;

        var selector = '#experience .collapse, #open-source .collapse, #education .collapse, #competitions .collapse, #certifications .collapse';
        var expanded = false;

        btn.addEventListener('click', function () {
          var nodes = document.querySelectorAll(selector);
          nodes.forEach(function (el) {
            var inst = bootstrap.Collapse.getOrCreateInstance(el, { toggle: false });
            if (expanded) { inst.hide(); } else { inst.show(); }
          });
          expanded = !expanded;
          label.textContent = expanded ? 'Collapse all' : 'Expand all';
          btn.querySelector('i').className = expanded
            ? 'fas fa-compress-arrows-alt me-2'
            : 'fas fa-expand-arrows-alt me-2';
        });
      });
    })();
    </script>

